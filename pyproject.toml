[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perceptpick"
version = "0.1.0"
description = "BOP-style benchmark for Object Grasping"
authors = [{name = "Varun Burde", email = "varunburde@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

# All scientific deps come from pixi (numpy, pybullet, trimesh, open3d, ...).
# This package adds no extra runtime requirements — the standalone library
# imports nothing that isn't already declared in pixi.toml.
dependencies = []

[tool.setuptools.packages.find]
include = ["perceptpick*"]
exclude = ["tests*", "scripts*", "examples*", "dataset*", "output*"]

[tool.setuptools.package-data]
"perceptpick.grippers" = ["assets/**/*"]
